name: Register production deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  production:
    name: Check production API
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://expense-tracker-api.onrender.com

    steps:
      - name: Verify Render deployment
        run: |
          curl --fail --silent --show-error \
            --retry 8 \
            --retry-delay 15 \
            --retry-all-errors \
            --max-time 30 \
            https://expense-tracker-api.onrender.com/
